name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # Remove this block when upload-pages-artifact bumps to v5+
  # (its internal upload-artifact@v4 still targets Node 20)
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Install dependencies
        run: just install

      - name: Build
        run: just build

      # TODO: bump to v5+ when released (fixes Node 20 warning)
      # Track: https://github.com/actions/upload-pages-artifact/pull/139
      - uses: actions/upload-pages-artifact@v4
        with:
          path: packages/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
