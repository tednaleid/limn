name: End-to-end

on:
  push:
    branches: [main, e2e-ci]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  obsidian:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Install dependencies
        run: just install

      # Obsidian is a large download; a new copy is fetched at most once a week.
      - name: Get cache week
        id: week
        run: echo "week=$(date +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Cache Obsidian
        uses: actions/cache@v4
        with:
          path: packages/obsidian/.obsidian-cache
          key: obsidian-cache-${{ runner.os }}-${{ steps.week.outputs.week }}

      # Obsidian needs a display and a window manager; the runner has neither.
      - name: Set up virtual display
        run: |
          sudo apt-get update -q
          sudo apt-get install -q -y herbstluftwm x11-xserver-utils
          export DISPLAY=:99
          echo "DISPLAY=$DISPLAY" >> "$GITHUB_ENV"
          Xvfb $DISPLAY -screen 0 1280x1024x24 +extension GLX -noreset &
          sleep 1
          herbstluftwm &
          sleep 1

      - name: Run end-to-end tests
        run: just obsidian-e2e
        env:
          WDIO_MAX_INSTANCES: 2
