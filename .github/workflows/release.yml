name: Release Obsidian Plugin

on:
  push:
    tags:
      - "[0-9]*"

permissions:
  contents: write
  # Required for actions/attest-build-provenance to mint Sigstore-signed
  # provenance attestations for the release assets. Surfaces in the
  # Obsidian community-plugin scorecard.
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Install dependencies
        run: just install

      - name: Build release assets
        run: just release

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            release/main.js
            release/styles.css

      - name: Extract release notes from tag
        run: git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > /tmp/release-notes.txt

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file /tmp/release-notes.txt \
            release/main.js release/manifest.json release/styles.css \
          || gh release upload "$GITHUB_REF_NAME" \
            release/main.js release/manifest.json release/styles.css \
            --clobber
