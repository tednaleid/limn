name: Release Desktop App

on:
  push:
    tags:
      # Single tag triggers both this workflow and `release.yml`. They
      # race to `gh release create`; the loser falls through to upload
      # with --clobber. Splitting the DMG into its own `desktop-*` tag
      # confused the Obsidian community-plugin scanner (it parsed
      # `desktop-0.9.X` as a plugin version that didn't match the
      # manifest), which triggered manual-review holds.
      - "[0-9]*"

permissions:
  contents: write

jobs:
  desktop:
    runs-on: macos-26
    env:
      # Job-level so `if: env.APPLE_CERTIFICATE != ''` gates signing steps
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Install dependencies
        run: just install

      - name: Build Release app with bundled web resources
        run: just desktop-release

      - name: Extract version from tag
        id: version
        run: echo "version=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

      # -- Conditional signing (only when Apple Developer secrets are configured) --

      - name: Import signing certificate
        if: env.APPLE_CERTIFICATE != ''
        env:
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"

          echo "$APPLE_CERTIFICATE" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

      - name: Store notarization credentials
        if: env.APPLE_CERTIFICATE != ''
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          xcrun notarytool store-credentials "limn-notarize" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD"

      - name: Re-sign app with Developer ID
        if: env.APPLE_CERTIFICATE != ''
        run: |
          codesign --force --deep --sign "Developer ID Application" \
            --options runtime \
            --entitlements packages/desktop/Limn/Limn.entitlements \
            --timestamp \
            /tmp/limn-desktop-build/Release/Limn.app

      # Replace the CI runner's dev certificate with an ad-hoc signature.
      # The dev cert is untrusted on other Macs ("damaged" error). Ad-hoc
      # keeps the app launchable and shows "unidentified developer" instead.
      - name: Ad-hoc re-sign
        if: env.APPLE_CERTIFICATE == ''
        run: |
          codesign --force --deep --sign - /tmp/limn-desktop-build/Release/Limn.app

      # -- DMG creation --

      - name: Create DMG
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          DMG_PATH="/tmp/limn-desktop-build/Limn-${VERSION}.dmg"
          STAGING="$(mktemp -d)"

          cp -R /tmp/limn-desktop-build/Release/Limn.app "$STAGING/Limn.app"
          ln -s /Applications "$STAGING/Applications"

          hdiutil create \
            -volname "Limn" \
            -srcfolder "$STAGING" \
            -ov \
            -format UDZO \
            "$DMG_PATH"

          rm -rf "$STAGING"
          echo "DMG_PATH=$DMG_PATH" >> "$GITHUB_ENV"

      - name: Sign DMG
        if: env.APPLE_CERTIFICATE != ''
        run: |
          codesign --sign "Developer ID Application" --timestamp "$DMG_PATH"

      - name: Notarize DMG
        if: env.APPLE_CERTIFICATE != ''
        run: |
          xcrun notarytool submit "$DMG_PATH" \
            --keychain-profile "limn-notarize" \
            --wait

      - name: Staple notarization ticket
        if: env.APPLE_CERTIFICATE != ''
        run: |
          xcrun stapler staple "$DMG_PATH"

      # -- Upload --

      - name: Extract release notes from tag
        run: git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > /tmp/release-notes.txt

      - name: Upload DMG to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file /tmp/release-notes.txt \
            "$DMG_PATH" \
          || gh release upload "$GITHUB_REF_NAME" \
            "$DMG_PATH" \
            --clobber

      # -- Update Homebrew cask --

      - name: Update Homebrew cask
        if: env.HOMEBREW_TAP_TOKEN != ''
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          SHA256=$(shasum -a 256 "$DMG_PATH" | awk '{print $1}')

          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/tednaleid/homebrew-limn.git" /tmp/homebrew-limn
          cd /tmp/homebrew-limn

          mkdir -p Casks
          cat > Casks/limn.rb << CASK
          cask "limn" do
            version "${VERSION}"
            sha256 "${SHA256}"

            url "https://github.com/tednaleid/limn/releases/download/#{version}/Limn-#{version}.dmg"
            name "Limn"
            desc "Keyboard-first, offline-capable mind map app"
            homepage "https://github.com/tednaleid/limn"

            depends_on macos: :sonoma

            app "Limn.app"

            zap trash: [
              "~/Library/Preferences/com.tednaleid.Limn.plist",
            ]
          end
          CASK

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/limn.rb
          git diff --cached --quiet && echo "No cask changes" && exit 0
          git commit -m "Update limn to ${VERSION}"
          git push

      # -- Cleanup --

      - name: Clean up keychain
        if: always() && env.APPLE_CERTIFICATE != ''
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
